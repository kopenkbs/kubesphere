authentication:
  # 登录失败次数限制
  authenticateRateLimiterMaxTries: 10  # 最多允许错误登录10次
  # 登录失败后封禁时间
  authenticateRateLimiterDuration: 10m0s  # 10分钟
  # 登录历史保留时间
  loginHistoryRetentionPeriod: 168h  # 登录历史保留7天
  # 是否允许多端同时登录
  multipleLogin: true

  issuer:
    # JWT 签发地址（即控制台访问的URL）
    url: "https://kubesphere.local"
    # JWT 密钥（必须配置，否则启动报错）
    jwtSecret: "p0eW04yVQ9Yerl6zGn79HKGX6QIfChGA"
    # 最大时间偏差（用于容忍服务器时间差）
    maximumClockSkew: 10s
    # 访问令牌有效期（Access Token 过期时间）
    accessTokenMaxAge: 1h
    # 令牌空闲超时时间（若此时间内未使用则过期）
    accessTokenInactivityTimeout: 30m

#s3:
#  # 对象存储配置（用于日志、镜像仓库、文件上传等）
#  endpoint: "s3.amazonaws.com"
